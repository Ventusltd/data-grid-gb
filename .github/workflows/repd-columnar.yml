name: Offline pinned REPD columnar prototype

on:
  pull_request:
    paths:
      - 'repd_columnar/**'
      - '.github/workflows/repd-columnar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: data-owner
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Ventusltd/globalgrid2050
          ref: 3a3106e248131f6e430c1ea03b4858d659755303
          path: source-repd
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /automation/repd/releases/2026q3.json
            /uk_renewables_pipeline/202611171609/data/v9.1/build_manifest.json
            /uk_renewables_pipeline/202611171609/data/v9.1/projects/*.json
            /uk_renewables_pipeline/202611171609/contracts/release.v9.1.json
            /uk_renewables_pipeline/202611171609/solar1000/manifest.json
            /uk_renewables_pipeline/202611171609/prospecting/manifest.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned CPU dependency (setup uses network)
        run: python -m pip install -r data-owner/repd_columnar/requirements.txt
      - name: Offline synthetic and actual pinned all-row readback tests
        working-directory: data-owner
        env:
          REPD_SOURCE_ROOT: ${{ github.workspace }}/source-repd
        run: python -B -m unittest discover -s repd_columnar/tests -v
      - name: Offline actual export and measured JSON/Parquet workload
        working-directory: data-owner
        run: python -B -m repd_columnar --source-root ../source-repd --out "${{ runner.temp }}/repd-columnar-output" --technology solar --limit 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repd-columnar-candidate-proof
          path: ${{ runner.temp }}/repd-columnar-output
          retention-days: 14
